<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة السنتر التعليمي</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>
(function(){
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('center_active_theme') || 'default');
  } catch(e) {}
})();
</script>
</head>
<body>

<div class="auth-screen">
  <div class="spinner spinner-dark" style="width:34px;height:34px;"></div>
</div>

<script type="module">
  import { seedIfNeeded, isLoggedIn, getSession } from "./assets/js/storage.js";
  await seedIfNeeded();
  if (isLoggedIn()) {
    const role = getSession()?.role;
    if (role === "student") window.location.replace("student/");
    else if (role === "parent") window.location.replace("parent/");
    else window.location.replace("staff/dashboard.html");
  } else {
    window.location.replace("site/");
  }
</script>
</body>
</html>
