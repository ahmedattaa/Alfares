<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة السنتر</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>
(function(){
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('center_active_theme') || 'default');
  } catch(e) {}
})();
</script>
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-card__logo" id="authLogo">سن</div>
    <div class="auth-card__title" id="authCenterName">سنتر الفارس التعليمي</div>
    <div class="auth-card__subtitle">تسجيل الدخول للوصول إلى لوحة التحكم</div>

    <div class="auth-error" id="authError">اسم المستخدم أو كلمة المرور غير صحيحة</div>

    <form id="loginForm">
      <div class="field">
        <label class="field__label">اسم المستخدم</label>
        <input class="input" type="text" id="username" placeholder="اكتب اسم المستخدم" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field__label">كلمة المرور</label>
        <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">
        <span id="loginBtnText">تسجيل الدخول</span>
      </button>
    </form>

    <div class="auth-demo-hint">بيانات تجريبية: admin / 1234</div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="assets/js/login.js"></script>
</body>
</html>
