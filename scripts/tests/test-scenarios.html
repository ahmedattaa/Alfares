function getTermsForYear(yearId) {
  return getTerms().filter(t => t.yearId === yearId).sort((a, b) => a.order - b.order);
}
function getMonthsForTerm(termId) {
  return getAcademicMonths().filter(m => m.termId === termId);
}
function getActiveAcademicYear() {
  return getAcademicYears().find(y => y.isCurrent) || null;
}
function findAcademicMonthById(dateStr) {
  if (!dateStr) return null;
  const months = getAcademicMonths();
  const terms = getTerms();
  const years = getAcademicYears();
  for (const m of months) {
    if (dateStr >= m.startDate && dateStr <= m.endDate) {
      const term = terms.find(t => t.id === m.termId);
      const year = years.find(y => y.id === term?.yearId);
      return { ...m, termId: term?.id, termName: term?.name, yearId: year?.id, yearName: year?.name };
    }
  }
  return null;
}
function findAcademicTermById(dateStr) {
  if (!dateStr) return null;
  const terms = getTerms();
  const years = getAcademicYears();
  for (const term of terms) {
    if (dateStr >= term.startDate && dateStr <= term.endDate) {
      const year = years.find(y => y.id === term.yearId);
      return { ...term, yearName: year?.name || "" };
    }
  }
  return null;
}

function todayISO() { return new Date().toISOString().slice(0, 10); }
function addDays(iso, days) {
  const d = new Date(iso); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// ────── دوال محاكاة Lookups ──────
function findGroup(groups, groupId) { return groups.find(g => g.id === groupId) || null; }
function groupsForGrade(groups, gradeId) { return groups.filter(g => g.gradeId === gradeId); }
function suggestStudentCode(students, group) {
  if (!group) return "";
  const count = students.filter(s => s.groupId === group.id).length;
  return group.code + (count + 1);
}
function dueAmount(student, group) {
  const fullPrice = group?.sessionPrice || 0;
  const discount = Math.min(fullPrice, Number(student?.discount || 0));
  return Math.max(0, fullPrice - discount);
}

// ────── دالة تطبيق الاستحقاقات ──────
function applyPendingCharges(studentId, groupId) {
  const charges = getExtraCharges();
  const students = getStudents();
  const groupStudents = students.filter(s => s.groupId === groupId && s.id !== studentId);
  if (!groupStudents.length) return 0;

  const batchMap = {};
  charges.forEach(c => {
    if (groupStudents.some(s => s.id === c.studentId) && c.batchId) {
      if (!batchMap[c.batchId]) batchMap[c.batchId] = { name: c.name, amount: c.amount, date: c.date };
    }
  });

  const studentBatchIds = new Set(
    charges.filter(c => c.studentId === studentId).map(c => c.batchId)
  );

  let added = 0;
  Object.entries(batchMap).forEach(([batchId, info]) => {
    if (studentBatchIds.has(batchId)) return;
    charges.push({ id: generateId("CHG"), batchId, studentId, name: info.name, amount: info.amount, date: info.date, status: "unpaid" });
    added++;
  });

  if (added) saveExtraCharges(charges);
  return added;
}

}
function assertEqual(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);

  else { totalFail++; results.push({ pass: false, msg, detail: "Expected: " + e + ", Got: " + a }); }
}

  assertEqual(m1.length, 6, "1.6: الترم الأول فيه 6 شهور");

  assertEqual(m2.length, 4, "1.7: الترم الثاني فيه 4 شهور");

  // 1.8 إنشاء سنة جديدة

  years.push({ id: "AY-2027", name: "2027 — 2028", isCurrent: false });
  saveAcademicYears(years);
  assert(getAcademicYears().some(y => y.id === "AY-2027"), "1.8: السنة الجديدة اتحفظت");

function S2_YearRollover() {
  const section = "S2: ترحيل الطلاب لعام جديد";
  resetDB();

  const students = getStudents().filter(s => s.status === "active");
  const grades = getGrades().sort((a, b) => a.order - b.order);
  const groups = getGroups();

  assert(students.length === 11, "2.1: 11 طالب نشط في البيانات", "Got: " + students.length);
  assertEqual(grades.length, 3, "2.2: 3 درجات");

  // ناخد أول 3 طلاب ونعملهم ترحيل
  const targets = students.slice(0, 3);
  const snapshots = targets.map(s => ({
    id: s.id, name: s.name,
    gradeId: s.gradeId, groupId: s.groupId,
    lateBalance: Number(s.lateBalance || 0)
  }));

  const all = getStudents();
  snapshots.forEach(snap => {
    const s = all.find(x => x.id === snap.id);
    const curGrade = grades.find(g => g.id === snap.gradeId);
    const nextGrade = grades.find(g => g.order === (curGrade?.order || 0) + 1);
    if (nextGrade) {
      const nextGroups = groups.filter(g => g.gradeId === nextGrade.id);
      s.gradeId = nextGrade.id;
      s.groupId = nextGroups[0]?.id || s.groupId;
    }
    if (snap.lateBalance > 0) {
      s.lateBalance = snap.lateBalance;
      s.openingBalance = (s.openingBalance || 0) + snap.lateBalance;
      s.openingBalanceNote = "ترحيل — " + todayISO();
    }
  });
  saveStudents(all);

  // التحقق
  const after = getStudents();
  snapshots.forEach(snap => {
    const s = after.find(x => x.id === snap.id);
    const curGrade = grades.find(g => g.id === snap.gradeId);
    const nextGrade = grades.find(g => g.order === (curGrade?.order || 0) + 1);

    if (nextGrade) {
      assertEqual(s.gradeId, nextGrade.id, `2.3: ${snap.name} اتنقل لسنة ${nextGrade.order}`);
    }
  });

  // 2.5 المتأخرات فضلت
  snapshots.filter(s => s.lateBalance > 0).forEach(snap => {
    const s = after.find(x => x.id === snap.id);
    assert(s.openingBalance >= snap.lateBalance,
      `2.5: ${snap.name} — openingBalance (${s.openingBalance}) >= lateBalance (${snap.lateBalance})`);
  });

  // رجّعهم
  const revert = getStudents();
  snapshots.forEach(snap => {
    const s = revert.find(x => x.id === snap.id);
    s.gradeId = snap.gradeId;
    s.groupId = snap.groupId;
    delete s.openingBalance;
    delete s.openingBalanceNote;
  });
  saveStudents(revert);
}

function S3_TermRollover() {
  resetDB();
  const students = getStudents();
  const groups = getGroups();

  const s = students.find(x => x.id === "STU-2005");
  assert(s !== null, "3.1: يوجد طالب STU-2005 (عمر)");
  assertEqual(s.groupId, "GRP-13", "3.2: في مجموعة GRP-13");

  const oldGroupId = s.groupId;
  const oldGradeId = s.gradeId;

  const others = groups.filter(g => g.gradeId === oldGradeId && g.id !== oldGroupId);
  assert(others.length > 0, "3.3: يوجد مجموعات أخرى في نفس السنة");

  // نقله
  const all = getStudents();
  const st = all.find(x => x.id === s.id);
  st.groupId = others[0].id;
  saveStudents(all);

  const after = getStudents().find(x => x.id === s.id);
  assertEqual(after.groupId, others[0].id, "3.4: اتنقل للمجموعة الجديدة");
  assertEqual(after.gradeId, oldGradeId, "3.5: الـ gradeId فضله (ترم2)");

  // رجّعه
  after.groupId = oldGroupId;
  saveStudents(getStudents());
}

function S7_PendingCharges() {
  resetDB();

  saveStudents(all);

  assert(added >= 1, `7.2: تم تطبيق ${added} استحقاق على الطالب الجديد`);

  const applied = getExtraCharges().filter(c => c.studentId === newS.id);
  assert(applied.length >= 1, "7.3: فيه استحقاق اتسجل للطالب الجديد");
  assertEqual(applied[0]?.batchId, "BATCH-BOOKS-2026", "7.4: الـ batchId صحيح");
  assertEqual(applied[0]?.name, "كتاب رياضيات", "7.5: اسم الاستحقاق صحيح");

  // تأكد إنه مش هيتسجل مرتين
  const added2 = applyPendingCharges(newS.id, "GRP-11");
  assertEqual(added2, 0, "7.6: تطبيق تاني = 0 (مفيش تكرار)");

  saveStudents(getStudents().filter(s => s.id !== newS.id));
  saveExtraCharges(getExtraCharges().filter(c => c.studentId !== newS.id));
}

function S12_RolloverLateBalance() {
  resetDB();
  const students = getStudents();
  const grades = getGrades().sort((a, b) => a.order - b.order);
  const groups = getGroups();

  const s = students.find(x => x.id === "STU-2002");
  const oldLate = Number(s.lateBalance);
  assertEqual(oldLate, 100, "12.1: lateBalance قبل = 100");

  // ترحيل
  const curGrade = grades.find(g => g.id === s.gradeId);
  const nextGrade = grades.find(g => g.order === (curGrade?.order || 0) + 1);
  assert(nextGrade !== null, "12.2: فيه سنة تالية");

  const all = getStudents();
  const st = all.find(x => x.id === s.id);
  st.gradeId = nextGrade.id;
  st.groupId = groups.filter(g => g.gradeId === nextGrade.id)[0]?.id || st.groupId;
  st.lateBalance = oldLate;
  st.openingBalance = (st.openingBalance || 0) + oldLate;
  saveStudents(all);

  const after = getStudents().find(x => x.id === s.id);
  assertEqual(Number(after.lateBalance), oldLate, "12.3: lateBalance فضل = 100");
  assert(after.openingBalance >= oldLate, `12.4: openingBalance (${after.openingBalance}) >= 100`);

  // رجّع
  after.gradeId = s.gradeId;
  after.groupId = s.groupId;
  after.lateBalance = oldLate;
  delete after.openingBalance;
  saveStudents(getStudents());
}
